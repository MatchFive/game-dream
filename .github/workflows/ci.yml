name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: MCP client smoke (fixture)
        run: |
          node scripts/mcp-scene-smoke.mjs \
            --config fixtures/mcp/fake-godot.json \
            --server fake-godot \
            --project dist/mcp-smoke \
            --scene ui/McpHud.tscn

  godot-runtime:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Install Godot 4.4.1
        run: |
          mkdir -p .tools/godot
          curl -L --fail --retry 3 \
            -o /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          unzip -o /tmp/godot.zip -d .tools/godot
          chmod +x .tools/godot/Godot_v4.4.1-stable_linux.x86_64
      - name: Real Godot runtime verify
        env:
          GODOT_BIN: ${{ github.workspace }}/.tools/godot/Godot_v4.4.1-stable_linux.x86_64
        run: pnpm smoke:godot --out dist/godot-runtime

  web-release:
    needs: test
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Compose, verify, and package Web M1
        run: |
          node packages/cli/dist/index.js web compose \
            --out dist/web \
            --content templates/rpg-action-m1/content \
            --modules modules \
            --name gamedream-m1
          node packages/cli/dist/index.js web verify --path dist/web --frames 1800
          node packages/cli/dist/index.js web package --path dist/web --out dist/web-release
      - uses: actions/upload-artifact@v4
        with:
          name: gamedream-web-release
          path: dist/web-release
          if-no-files-found: error

  godot-release:
    needs: test
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Compose and package Godot M1 source release
        run: |
          node packages/cli/dist/index.js compose \
            --spec fixtures/specs/m1.yaml \
            --out dist/godot \
            --modules modules \
            --templates templates
          node packages/cli/dist/index.js godot package \
            --path dist/godot \
            --out dist/godot-release
      - uses: actions/upload-artifact@v4
        with:
          name: gamedream-godot-release
          path: dist/godot-release
          if-no-files-found: error

  unity-release:
    needs: test
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Compose and statically verify Unity M1 source release
        run: |
          node packages/cli/dist/index.js unity compose \
            --out dist/unity \
            --content templates/rpg-action-m1/content \
            --name gamedream-m1
          node packages/cli/dist/index.js unity verify --path dist/unity
      - uses: actions/upload-artifact@v4
        with:
          name: gamedream-unity-release
          path: dist/unity
          if-no-files-found: error

  release-acceptance:
    needs: [web-release, godot-release, unity-release]
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/download-artifact@v4
        with:
          path: dist/artifacts
      - name: Accept downloaded Web/Godot/Unity artifacts
        run: |
          node scripts/release-acceptance.mjs \
            --web dist/artifacts/gamedream-web-release \
            --godot dist/artifacts/gamedream-godot-release \
            --unity-dir dist/artifacts/gamedream-unity-release \
            --skip-runtime \
            --out-dir dist/acceptance
      - uses: actions/upload-artifact@v4
        with:
          name: gamedream-acceptance
          path: dist/acceptance/acceptance.json
          if-no-files-found: error

  release-manifest:
    needs: [web-release, godot-release, unity-release, release-acceptance]
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist/artifacts
      - name: Write release manifest
        run: |
          node - <<'NODE'
          const { createHash } = require('node:crypto');
          const { readFileSync, readdirSync, statSync, writeFileSync } = require('node:fs');
          const { join, relative } = require('node:path');
          function walk(dir) {
            return readdirSync(dir).flatMap((name) => {
              const path = join(dir, name);
              return statSync(path).isDirectory() ? walk(path) : [path];
            });
          }
          const root = 'dist/artifacts';
          const files = walk(root).sort().map((path) => ({
            path: relative(root, path).replaceAll('\\\\', '/'),
            bytes: statSync(path).size,
            sha256: createHash('sha256').update(readFileSync(path)).digest('hex'),
          }));
          writeFileSync(
            'dist/release-manifest.json',
            JSON.stringify({ generated_at: new Date().toISOString(), files }, null, 2) + '\\n',
          );
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: gamedream-release-manifest
          path: dist/release-manifest.json
          if-no-files-found: error

