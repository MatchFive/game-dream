name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Boundary check (external agents must not write game content)
        run: pnpm check:boundaries
      - name: MCP client smoke (fixture)
        run: |
          node scripts/mcp-scene-smoke.mjs \
            --config fixtures/mcp/fake-godot.json \
            --server fake-godot \
            --project dist/mcp-smoke \
            --scene ui/McpHud.tscn

  # Windows 是主要开发平台（start.cmd、Godot console、Unity）。只在 Linux 跑
  # 测试会漏掉 Windows 专属失败，例如 fs.cpSync 在非 ASCII 路径下抛 ENOENT 或
  # 直接段错误，Linux 上却全部通过。
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Chinese project path smoke
        shell: pwsh
        run: |
          node packages/cli/dist/index.js create "做一个俯视角动作RPG" `
            --out "dist/中文 项目/我的游戏" `
            --provider fake --modules modules --templates templates
          if ($LASTEXITCODE -ne 0) { throw "create exited $LASTEXITCODE" }
          $verify = node packages/cli/dist/index.js verify --path "dist/中文 项目/我的游戏"
          $verify | Write-Host
          if ($LASTEXITCODE -ne 0) { throw "verify exited $LASTEXITCODE" }
          if (-not ($verify -match 'G1: pass')) { throw "G1 did not pass on a non-ASCII path" }

  godot-runtime:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Install Godot 4.4.1
        run: |
          mkdir -p .tools/godot
          curl -L --fail --retry 3 \
            -o /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          unzip -o /tmp/godot.zip -d .tools/godot
          chmod +x .tools/godot/Godot_v4.4.1-stable_linux.x86_64
      - name: Real Godot runtime verify
        env:
          GODOT_BIN: ${{ github.workspace }}/.tools/godot/Godot_v4.4.1-stable_linux.x86_64
        run: pnpm smoke:godot --out dist/godot-runtime

  godot-export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Install Godot 4.4.1 and export templates
        run: |
          mkdir -p .tools/godot
          curl -L --fail --retry 3 \
            -o /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          unzip -o /tmp/godot.zip -d .tools/godot
          chmod +x .tools/godot/Godot_v4.4.1-stable_linux.x86_64
          mkdir -p "$HOME/.local/share/godot/export_templates/4.4.1.stable"
          curl -L --fail --retry 3 \
            -o /tmp/godot-templates.tpz \
            https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz
          unzip -j -o /tmp/godot-templates.tpz 'templates/*' \
            -d "$HOME/.local/share/godot/export_templates/4.4.1.stable"
      - name: Check templates
        env:
          GODOT_BIN: ${{ github.workspace }}/.tools/godot/Godot_v4.4.1-stable_linux.x86_64
        run: |
          node packages/cli/dist/index.js godot templates --platform linux --json
      - name: Real Linux export
        env:
          GODOT_BIN: ${{ github.workspace }}/.tools/godot/Godot_v4.4.1-stable_linux.x86_64
        run: pnpm smoke:godot-export -- --require --out dist/godot-export
      - uses: actions/upload-artifact@v4
        with:
          name: gamedream-godot-export
          path: dist/godot-export/build
          if-no-files-found: error

  godot-mcp:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Install Godot 4.4.1
        run: |
          mkdir -p .tools/godot
          curl -L --fail --retry 3 \
            -o /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          unzip -o /tmp/godot.zip -d .tools/godot
          chmod +x .tools/godot/Godot_v4.4.1-stable_linux.x86_64
      - name: Real Godot MCP scene smoke
        env:
          GODOT_BIN: ${{ github.workspace }}/.tools/godot/Godot_v4.4.1-stable_linux.x86_64
        run: |
          mkdir -p .tools/mcp dist/mcp-real
          printf '[application]\n' > dist/mcp-real/project.godot
          node -e "const fs=require('fs');fs.writeFileSync('.tools/mcp/godot.json',JSON.stringify({mcpServers:{godot:{transport:'stdio',command:'npx',args:['-y','@coding-solo/godot-mcp'],env:{DEBUG:'false',GODOT_PATH:process.env.GODOT_BIN}}}},null,2))"
          node scripts/mcp-scene-smoke.mjs \
            --config .tools/mcp/godot.json \
            --server godot \
            --project dist/mcp-real \
            --scene ui/McpHud.tscn
      - uses: actions/upload-artifact@v4
        with:
          name: gamedream-mcp-scene
          path: dist/mcp-real/ui/McpHud.tscn
          if-no-files-found: error


  unity-runtime:
    # Optional: set UNITY_RUNTIME_ENABLED=true and UNITY_BIN as repository
    # variables. Requires a self-hosted Windows runner with the `unity` label.
    if: ${{ vars.UNITY_RUNTIME_ENABLED == 'true' }}
    runs-on: [self-hosted, windows, unity]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Real Unity runtime, build, smoke, screenshot
        env:
          UNITY_BIN: ${{ vars.UNITY_BIN }}
        run: pnpm exec vitest run packages/unity/test/runtime.test.ts
      - name: Unity release artifact
        env:
          UNITY_BIN: ${{ vars.UNITY_BIN }}
        run: pnpm smoke:unity-release -- --require --out dist/unity-release
      - uses: actions/upload-artifact@v4
        with:
          name: gamedream-unity-release-player
          path: |
            dist/unity-release/Builds
            dist/unity-release/smoke.log
            dist/unity-release/Screenshots
          if-no-files-found: error

  web-release:
    needs: test
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Compose, verify, and package Web M1
        run: |
          node packages/cli/dist/index.js web compose \
            --out dist/web \
            --content templates/rpg-action-m1/content \
            --modules modules \
            --name gamedream-m1
          node packages/cli/dist/index.js web verify --path dist/web --frames 1800
          node packages/cli/dist/index.js web package --path dist/web --out dist/web-release
      - uses: actions/upload-artifact@v4
        with:
          name: gamedream-web-release
          path: dist/web-release
          if-no-files-found: error

  godot-release:
    needs: test
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Compose and package Godot M1 source release
        run: |
          node packages/cli/dist/index.js compose \
            --spec fixtures/specs/m1.yaml \
            --out dist/godot \
            --modules modules \
            --templates templates
          node packages/cli/dist/index.js godot package \
            --path dist/godot \
            --out dist/godot-release
      - uses: actions/upload-artifact@v4
        with:
          name: gamedream-godot-release
          path: dist/godot-release
          if-no-files-found: error

  unity-release:
    needs: test
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Compose and statically verify Unity M1 source release
        run: |
          node packages/cli/dist/index.js unity compose \
            --out dist/unity \
            --content templates/rpg-action-m1/content \
            --name gamedream-m1
          node packages/cli/dist/index.js unity verify --path dist/unity
      - uses: actions/upload-artifact@v4
        with:
          name: gamedream-unity-release
          path: dist/unity
          if-no-files-found: error

  release-acceptance:
    needs: [web-release, godot-release, unity-release]
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/download-artifact@v4
        with:
          path: dist/artifacts
      - name: Accept downloaded Web/Godot/Unity artifacts
        run: |
          node scripts/release-acceptance.mjs \
            --web dist/artifacts/gamedream-web-release \
            --godot dist/artifacts/gamedream-godot-release \
            --unity-dir dist/artifacts/gamedream-unity-release \
            --skip-runtime \
            --out-dir dist/acceptance
      - uses: actions/upload-artifact@v4
        with:
          name: gamedream-acceptance
          path: dist/acceptance/acceptance.json
          if-no-files-found: error

  release-manifest:
    needs: [web-release, godot-release, unity-release, release-acceptance]
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist/artifacts
      - name: Write release manifest
        run: |
          node - <<'NODE'
          const { createHash } = require('node:crypto');
          const { readFileSync, readdirSync, statSync, writeFileSync } = require('node:fs');
          const { join, relative } = require('node:path');
          function walk(dir) {
            return readdirSync(dir).flatMap((name) => {
              const path = join(dir, name);
              return statSync(path).isDirectory() ? walk(path) : [path];
            });
          }
          const root = 'dist/artifacts';
          const files = walk(root).sort().map((path) => ({
            path: relative(root, path).replaceAll('\\\\', '/'),
            bytes: statSync(path).size,
            sha256: createHash('sha256').update(readFileSync(path)).digest('hex'),
          }));
          writeFileSync(
            'dist/release-manifest.json',
            JSON.stringify({ generated_at: new Date().toISOString(), files }, null, 2) + '\\n',
          );
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: gamedream-release-manifest
          path: dist/release-manifest.json
          if-no-files-found: error

