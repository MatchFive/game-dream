name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  web-release:
    needs: test
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Compose, verify, and package Web M1
        run: |
          node packages/cli/dist/index.js web compose \
            --out dist/web \
            --content templates/rpg-action-m1/content \
            --modules modules \
            --name gamedream-m1
          node packages/cli/dist/index.js web verify --path dist/web --frames 900
          node packages/cli/dist/index.js web package --path dist/web --out dist/web-release
      - uses: actions/upload-artifact@v4
        with:
          name: gamedream-web-release
          path: dist/web-release
          if-no-files-found: error
