id: system.puzzle
version: 1.0.0
engine: godot
engine_version: ">=4.4 <5"
kind: system
genres: [puzzle]
depends:
  core.events: "^1.0.0"
  core.stats: "^1.0.0"
provides:
  components: [Sokoban]
input_actions:
  - name: move_left
    keys: [A, LEFT]
  - name: move_right
    keys: [D, RIGHT]
  - name: move_up
    keys: [W, UP]
  - name: move_down
    keys: [S, DOWN]
  - name: restart
    keys: [R]
main_scene: scenes/board.tscn
scenarios: [scenarios/puzzle.yaml]
tests: []
ai_skill: skills/puzzle.md
docs: api.md
license: Apache-2.0
