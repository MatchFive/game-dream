id: system.quests
version: 1.0.0
engine: godot
engine_version: ">=4.4 <5"
kind: system
genres: [rpg, roguelike]
depends:
  core.content: "^1.0.0"
  core.events: "^1.0.0"
provides:
  services: [quests]
autoloads:
  - name: QuestService
    path: src/quest_service.gd
    order: 45
save_sections:
  - key: quests
    serializer: src/quest_service.gd
scenarios: [scenarios/kill.yaml]
ai_skill: skills/quests.md
docs: api.md
license: Apache-2.0
