<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GameDream Web M0</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main>
      <h1>GameDream Web M0</h1>
      <div id="game"></div>
      <p id="status">WASD move · J attack · I inventory · Q quests · O settings · R reset</p>
      <p id="quests-line"></p>
      <section id="inventory" class="panel hidden">
        <h2>Inventory</h2>
        <ul id="inventory-list"></ul>
      </section>
      <section id="quests" class="panel hidden">
        <h2>Quests</h2>
        <ul id="quest-list"></ul>
      </section>
      <section id="settings" class="panel hidden">
        <h2>Settings</h2>
        <label>Music <input id="music" type="range" min="0" max="1" step="0.05" /></label>
        <label>SFX <input id="sfx" type="range" min="0" max="1" step="0.05" /></label>
        <label class="check"><input id="fullscreen" type="checkbox" /> Fullscreen</label>
      </section>
    </main>
    <script src="./vendor/phaser.min.js"></script>
    <script type="module" src="./game.js"></script>
  </body>
</html>
