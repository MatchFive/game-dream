<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>GameDream Settings</title>
<link rel="stylesheet" href="/styles.css?v=7">
<style>
  body { margin: 0; min-height: 100vh; background: #0b0d0a; color: var(--text); }
  .settings-main { max-width: 1160px; margin: 0 auto; padding: 36px 24px 72px; display: grid; gap: 20px; }
  .settings-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .settings-card { border: 1px solid var(--line-strong); border-radius: 6px; background: #10130e; padding: 18px; }
  .settings-card h1 { margin: 0 0 4px; font: 18px/1.2 var(--sans); }
  .settings-card h2 { margin: 18px 0 8px; color: var(--lime); font: 10px/1.2 var(--mono); letter-spacing: .12em; text-transform: uppercase; }
  .settings-card p { margin: 0 0 14px; color: var(--dim); font: 10px/1.5 var(--mono); }
  .settings-field { display: grid; gap: 5px; margin-bottom: 10px; }
  .settings-field span { color: var(--muted); font: 9px/1.2 var(--mono); }
  .settings-field input, .settings-field select, .settings-field textarea { width: 100%; box-sizing: border-box; border: 1px solid var(--line-strong); border-radius: 3px; padding: 8px; color: var(--text); background: #090b08; font: 11px/1.4 var(--mono); }
  .settings-field textarea { min-height: 60px; resize: vertical; }
  .settings-actions { display: flex; gap: 8px; align-items: center; margin-top: 12px; }
  .settings-actions .status { color: var(--dim); font: 9px/1.2 var(--mono); }
  .studio-nav a { color: var(--dim); text-decoration: none; font: 9px/1.2 var(--mono); letter-spacing: .05em; }
  .studio-nav a[aria-current="page"] { color: var(--lime); }
  .project-list { display: grid; gap: 6px; margin-top: 12px; }
  .project-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 9px; border: 1px solid var(--line); border-radius: 4px; }
  .project-row .name { min-width: 0; }
  .project-row strong { display: block; font: 11px/1.2 var(--mono); }
  .project-row small { color: var(--dim); font: 9px/1.3 var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .project-row .actions { display: flex; gap: 5px; flex-shrink: 0; }
  .project-row .current { color: var(--lime); font: 9px/1.2 var(--mono); }
  .settings-toast { position: fixed; right: 20px; bottom: 20px; padding: 9px 12px; border: 1px solid var(--lime); color: var(--lime); background: #0b0d0a; font: 10px/1.3 var(--mono); opacity: 0; transform: translateY(8px); transition: .18s; pointer-events: none; }
  .settings-toast.show { opacity: 1; transform: translateY(0); }
  @media (max-width: 760px) { .settings-grid { grid-template-columns: 1fr; } }
</style>
<link rel="stylesheet" href="/theme.css?v=3">
</head>
<body>
<header class="topbar studio-topbar">
  <a class="brand" href="/" style="text-decoration:none">
    <span class="brand-mark">✦</span>
    <span class="brand-name">GAMEDREAM</span>
    <span class="brand-sub">STUDIO</span>
  </a>
  <div class="crumb"><strong>设置</strong><span class="sep">/</span><span>模型 · 生图 · 引擎 · 项目</span></div>
  <nav class="studio-nav" aria-label="Studio sections">
    <a href="/">MISSION</a>
    <a href="/assets">ASSETS</a>
    <a href="/settings" aria-current="page">SETTINGS</a>
  </nav>
</header>
<main class="settings-main">
  <div class="settings-grid">
    <section class="settings-card">
      <h1>Studio 设置</h1>
      <p>保存到当前 workspace 的 <code>.gamedream/studio/settings.json</code>。保存后当前 Studio 立即使用新的模型/生图配置。</p>
      <form id="settingsForm">
        <h2>模型</h2>
        <label class="settings-field"><span>Provider</span>
          <select id="modelProvider"><option value="auto">auto</option><option value="fake">fake</option><option value="openai">openai</option></select>
        </label>
        <label class="settings-field"><span>Model</span><input id="modelName" placeholder="gpt-4o-mini"></label>
        <label class="settings-field"><span>Base URL</span><input id="modelBaseUrl" placeholder="https://api.openai.com/v1"></label>
        <label class="settings-field"><span>API Key（留空保持已保存值）</span><input id="modelApiKey" type="password" autocomplete="new-password"></label>

        <h2>生图 / 音频</h2>
        <label class="settings-field"><span>ComfyUI URL</span><input id="comfyUrl" placeholder="http://127.0.0.1:8188"></label>
        <div class="settings-field">
          <span>旧版单个 workflow 文件</span>
          <div class="path-input">
            <input id="comfyWorkflow" placeholder="D:/path/workflow.json">
            <button class="button secondary" type="button" data-pick-input="comfyWorkflow" data-kind="file" data-title="选择 ComfyUI workflow JSON" data-filter="JSON (*.json)|*.json|All files (*.*)|*.*">浏览…</button>
          </div>
        </div>
        <div class="settings-field">
          <span>工作流目录</span>
          <div class="path-input">
            <input id="comfyWorkflowsDir" placeholder="workspace 下的 .gamedream/studio/workflows，或绝对路径">
            <button class="button secondary" type="button" data-pick-input="comfyWorkflowsDir" data-kind="folder" data-title="选择 workflow 目录">浏览…</button>
          </div>
        </div>

        <h2>Agent 扩展</h2>
        <div class="settings-field">
          <div class="settings-field-head">
            <span>Skills 根目录</span>
            <button class="button secondary path-add" type="button" data-pick-list="skills" data-kind="folder" data-title="选择 skills 根目录">添加目录</button>
          </div>
          <div class="path-list" id="agentSkillsList"></div>
        </div>
        <div class="settings-field">
          <div class="settings-field-head">
            <span>MCP 配置</span>
            <button class="button secondary path-add" type="button" data-pick-list="mcp" data-kind="file" data-title="选择 MCP 配置文件" data-filter="JSON (*.json)|*.json|All files (*.*)|*.*">添加文件</button>
          </div>
          <div class="path-list" id="agentMcpList"></div>
        </div>

        <h2>引擎</h2>
        <div class="settings-field">
          <span>Godot 可执行文件</span>
          <div class="path-input">
            <input id="godotBin" placeholder="D:/godot/Godot.exe">
            <button class="button secondary" type="button" data-pick-input="godotBin" data-kind="file" data-title="选择 Godot 可执行文件" data-filter="Executable (*.exe)|*.exe|All files (*.*)|*.*">浏览…</button>
          </div>
        </div>
        <div class="settings-field">
          <span>Unity Editor 目录</span>
          <div class="path-input">
            <input id="unityBin" placeholder="D:/unity/6000.6.9f1/Editor">
            <button class="button secondary" type="button" data-pick-input="unityBin" data-kind="folder" data-title="选择 Unity Editor 目录">浏览…</button>
          </div>
        </div>
        <div class="settings-actions"><button class="button primary" type="submit">保存设置</button><span class="status" id="settingsStatus"></span></div>
      </form>
    </section>

    <section class="settings-card">
      <h1>项目</h1>
      <p>Workspace：<code id="workspacePath">—</code></p>
      <form id="projectForm">
        <h2>新建项目</h2>
        <label class="settings-field"><span>目录名</span><input id="projectName" placeholder="my-survivor" required></label>
        <label class="settings-field"><span>游戏想法</span><textarea id="projectPrompt" placeholder="一个霓虹幸存者竞技场，自动攻击，60 秒生存。" required></textarea></label>
        <div class="settings-actions"><button class="button primary" type="submit" id="projectCreate">创建项目</button><span class="status" id="projectStatus"></span></div>
      </form>
      <h2>打开已有项目</h2>
      <div class="settings-field">
        <span>项目路径</span>
        <div class="path-input">
          <input id="importPath" placeholder="D:/projects/my-game">
          <button class="button secondary" type="button" data-pick-input="importPath" data-kind="folder" data-title="选择已有项目文件夹">浏览…</button>
        </div>
      </div>
      <div class="settings-actions"><button class="button secondary" type="button" id="importOpen">打开项目</button><span class="status" id="importStatus"></span></div>
      <div class="project-list" id="recentProjects"></div>
      <div class="project-list" id="projectList"></div>
    </section>
  </div>
</main>
<div class="settings-toast" id="toast" role="status"></div>
<script type="module" src="/settings.js?v=6"></script>
</body>
</html>
